name: CI

on:
  push:
    branches: [main, resume-tailor-staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Tests run offline in demo mode - no API keys, no network, no secrets.
      - run: pytest tests/ -q
      # The whole app must import cleanly (catches syntax errors and broken
      # imports in files the tests don't touch).
      - run: python -c "import app"
